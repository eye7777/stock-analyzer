name: 📊 台股 AI 每日分析

# ── 執行時機 ──────────────────────────────────────────────────
on:
  # 由 cron-job.org 外部觸發
  workflow_dispatch:

permissions:
  contents: write

# ── 工作定義 ──────────────────────────────────────────────────
jobs:
  run-stock-analysis:
    name: 抓取台股資料並寄送 AI 分析報告
    runs-on: ubuntu-latest

    steps:
      - name: ① 下載程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ② 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ③ 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ④ 執行台股 AI 分析
        env:
          FINMIND_TOKEN:     ${{ secrets.FINMIND_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:    ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
        run: python stock_analyzer.py

      # 寫回 data/signals_log.csv，放在④之後：這裡失敗完全不影響④已經
      # 寄出的信。只在 main 分支跑（手動選別的分支測試不會誤寫回 main），
      # continue-on-error 確保這步失敗不會讓整個 job 變紅、掩蓋④其實成功。
      # push 失敗最多重試 3 次，每次重試前都先 git pull --rebase；rebase
      # 失敗就 git rebase --abort 後算這次嘗試失敗，換下一次重試。
      - name: ⑤ 寫回訊號日誌（僅 main 分支）
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add data/signals_log.csv
          if git diff --cached --quiet; then
            echo "::warning::signals_log.csv 無變更，略過 commit"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update signals_log [skip ci]"

            success=false
            for attempt in 1 2 3; do
              echo "推送嘗試 $attempt/3"
              if git pull --rebase origin main; then
                if git push origin HEAD:main; then
                  success=true
                  break
                else
                  echo "::warning::第 $attempt 次 push 失敗"
                fi
              else
                echo "::warning::第 $attempt 次 git pull --rebase 失敗，中止 rebase"
                git rebase --abort || true
              fi
            done

            if [ "$success" != "true" ]; then
              echo "::warning::signals_log 寫回失敗（重試 3 次後仍未成功），略過本次 push，下次執行再試"
            fi
          fi

      - name: ⑥ 顯示執行日誌（失敗時）
        if: failure()
        run: tail -50 analyzer.log 2>/dev/null || echo "無日誌檔案"
